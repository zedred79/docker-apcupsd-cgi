# Build the image and publish it to Docker Hub (zedred/apcupsd-cgi).
# Runs on every push to master, once a week (to pick up Debian security updates)
# and on demand. Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
name: Docker publish

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - '*.service'
      - 'rebuild.sh'
  schedule:
    - cron: '17 4 * * 1'   # every Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  IMAGE: zedred/apcupsd-cgi
  DEBIAN_RELEASE: trixie

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build (no cache, fresh base image)
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          no-cache: true
          load: true
          tags: ${{ env.IMAGE }}:test

      - name: Smoke test and read apcupsd version
        id: ver
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:80 -e UPS_HOST=127.0.0.1 ${{ env.IMAGE }}:test
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/multimon.cgi && ok=1 && break
            sleep 1
          done
          docker logs smoke; docker rm -f smoke
          [ "${ok:-}" = 1 ] || { echo "multimon.cgi did not answer"; exit 1; }
          v=$(docker run --rm --entrypoint dpkg-query ${{ env.IMAGE }}:test -W -f='${Version}' apcupsd-cgi)
          echo "version=${v%%-*}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        run: |
          for t in latest "${{ steps.ver.outputs.version }}-${DEBIAN_RELEASE}"; do
            docker tag ${{ env.IMAGE }}:test ${{ env.IMAGE }}:$t
            docker push ${{ env.IMAGE }}:$t
          done
